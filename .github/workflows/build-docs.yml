name: Deploy GitBuilding Site to GitHub Pages

on:
  #push:
  #  branches: [ main ]   # Replace with your actual branch name

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GitBuilding
        run: |
          pip install setuptools
          pip install gitbuilding

      - name: Build the HTML site
        run: gitbuilding build-html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/               # GitBuilding's default HTML output folder

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4